server:
  port: 8081
spring:
  application:
    name: CUSTOMER          # the gateway route uses lb://CUSTOMER
  datasource:
    url: jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
