server:
  port: 8761
spring:
  application:
    name: EUREKA-SERVER
eureka:
  instance:
    hostname: localhost
  client:
    # This is the registry itself, so it must not register with (or fetch from) another one
    register-with-eureka: false
    fetch-registry: false
  server:
    # Local development: let clients see new services within seconds instead of ~30s
    response-cache-update-interval-ms: 3000
    use-read-only-response-cache: false
